<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>去野 · 骑行助手</title>
  <style>
    :root {
      --bg: #F8F7F4; --surface: #EEEDEA; --card: #FFFFFF;
      --text: #1A1A1A; --text2: #6B6B6B; --text3: #A0A0A0;
      --accent: #E87D22; --success: #3C9D6E; --danger: #D94A4A; --info: #5B8EC9;
      --shadow: 0 1px 2px rgba(0,0,0,.03), 0 4px 16px rgba(0,0,0,.04);
      --radius: 18px; --radius-sm: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg); color: var(--text); height: 100%;
      -webkit-font-smoothing: antialiased; overflow: hidden;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .app { max-width: 430px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; position: relative; background: var(--bg); }
    .header {
      padding: 10px 18px; padding-top: max(10px, env(safe-area-inset-top));
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; background: rgba(248,247,244,.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 50;
    }
    .brand { font-size: 19px; font-weight: 700; letter-spacing: -.3px; color: var(--text); }
    .weather-pill {
      display: flex; align-items: center; gap: 6px; padding: 7px 14px;
      border-radius: 100px; background: var(--surface); font-size: 13px;
      font-weight: 600; color: var(--text); cursor: pointer; border: none; font-family: inherit;
    }
    .page-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 8px; }
    .page-body::-webkit-scrollbar { width: 0; }
    .bottom-nav {
      display: flex; align-items: center; justify-content: center; gap: 2px;
      margin: 0 16px; margin-bottom: max(8px, env(safe-area-inset-bottom));
      background: rgba(255,255,255,.9); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px); border: .5px solid rgba(0,0,0,.05);
      border-radius: 24px; padding: 3px; flex-shrink: 0; z-index: 50;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: 7px 4px; cursor: pointer; border: none; background: transparent;
      font-family: inherit; font-size: 9px; font-weight: 500; color: var(--text3);
      transition: all .25s ease; border-radius: 20px; position: relative;
      min-height: 48px; justify-content: center;
    }
    .nav-item.active { color: var(--text); font-weight: 600; }
    .nav-item.active::before { content: ''; position: absolute; inset: 1px; background: var(--surface); border-radius: 18px; z-index: -1; }
    .nav-item.active .nav-icon { color: var(--accent); }
    .nav-icon { font-size: 19px; line-height: 1; transition: color .25s ease; color: var(--text3); }
    .card { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 10px; box-shadow: var(--shadow); }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 8px; margin-top: 2px; padding-left: 2px; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    .btn { display: block; width: 100%; padding: 15px; border-radius: var(--radius-sm); border: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: center; transition: transform .12s ease; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--text); }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    .hero-card {
      background: linear-gradient(135deg, #FFF7F0, #FFEDDD); border-radius: var(--radius);
      padding: 26px 22px; margin-bottom: 14px; cursor: pointer; transition: transform .15s ease;
      position: relative; overflow: hidden;
    }
    .hero-card::after { content: ''; position: absolute; right: -20px; top: -20px; width: 120px; height: 120px; background: rgba(232,125,34,.06); border-radius: 50%; }
    .hero-card:active { transform: scale(.97); }
    .hero-btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 100px; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; border: none; cursor: pointer; margin-top: 16px; transition: transform .12s ease; }
    .hero-btn:active { transform: scale(.95); }
    .equip-grid { display: flex; gap: 8px; flex-wrap: wrap; }
    .equip-chip {
      padding: 11px 15px; border-radius: var(--radius-sm); background: var(--bg); font-size: 14px;
      display: flex; align-items: center; gap: 6px; cursor: pointer; transition: all .2s ease; border: 1px solid transparent;
    }
    .equip-chip:active { transform: scale(.93); }
    .equip-chip.ok { border-color: rgba(60,157,110,.25); background: #F4FAF7; }
    .equip-chip.warn { border-color: rgba(232,125,34,.25); background: #FFF9F4; }
    .equip-chip.miss { border-color: rgba(217,74,74,.25); background: #FFF6F6; }
    .record-item { display: flex; align-items: center; padding: 15px 0; border-bottom: .5px solid rgba(0,0,0,.04); cursor: pointer; position: relative; }
    .record-item:last-child { border-bottom: none; }
    .record-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; justify-content: center; margin-right: 14px; font-size: 20px; }
    .record-info { flex: 1; }
    .record-name { font-weight: 600; font-size: 15px; }
    .record-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .record-stat { font-weight: 700; color: var(--accent); font-size: 14px; }
    .badge-grid { display: flex; gap: 20px; flex-wrap: wrap; }
    .badge-item { text-align: center; width: 58px; cursor: pointer; transition: transform .12s ease; }
    .badge-item:active { transform: scale(.95); }
    .badge-icon { font-size: 32px; margin-bottom: 4px; }
    .badge-label { font-size: 10px; color: var(--text3); font-weight: 500; }
    .overlay { position: fixed; inset: 0; z-index: 200; display: flex; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay-mask { position: absolute; inset: 0; background: rgba(0,0,0,.3); backdrop-filter: blur(4px); }
    .overlay-panel { position: absolute; bottom: 0; left: 0; right: 0; background: var(--card); border-radius: 24px 24px 0 0; padding: 24px; transform: translateY(100%); transition: transform .4s cubic-bezier(.16,1,.3,1); }
    .overlay.show .overlay-panel { transform: translateY(0); }
    .ride-full { position: fixed; inset: 0; z-index: 300; background: #121212; color: #fff; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .4s ease; }
    .ride-full.active { opacity: 1; pointer-events: auto; }
    .ride-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: rgba(0,0,0,.5); backdrop-filter: blur(10px); }
    .ride-data { display: flex; justify-content: space-around; padding: 22px; background: rgba(0,0,0,.6); border-top: 1px solid rgba(255,255,255,.06); }
    .ride-value { font-size: 36px; font-weight: 200; display: block; line-height: 1; color: var(--accent); }
    .ride-label { font-size: 10px; opacity: .5; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
    .ride-ctrl { display: flex; justify-content: center; gap: 18px; padding: 20px; background: rgba(0,0,0,.4); }
    .ride-ctrl-btn { width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer; font-size: 20px; background: rgba(255,255,255,.08); color: #fff; display: flex; align-items: center; justify-content: center; }
    .ride-ctrl-btn:active { transform: scale(.9); }
    .ride-ctrl-sos { background: var(--danger); }
    .toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(30,30,30,.92); backdrop-filter: blur(20px); color: #fff; padding: 10px 20px; border-radius: 100px; font-size: 13px; font-weight: 600; z-index: 600; white-space: nowrap; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
    .home-edit-btn { font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: none; font-family: inherit; }
    .module-hide { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--danger); color: #fff; display: none; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; z-index: 2; }
    .editing .module-hide { display: flex; }
    .personal-stats { font-size: 13px; color: var(--text2); margin-bottom: 12px; }
    .ghost-module {
      height: 60px; background: rgba(0,0,0,.02); border: 2px dashed rgba(0,0,0,.1); border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 13px;
      margin-bottom: 10px; cursor: pointer;
    }
    .quick-depart-btn {
      background: var(--accent); color: #fff; width: 28px; height: 28px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 14px; cursor: pointer; transition: transform .12s ease;
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    }
    .quick-depart-btn:active { transform: translateY(-50%) scale(.9); }
    .wp-item {
      display: flex; align-items: center; gap: 10px; padding: 12px;
      background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 6px;
    }
    .wp-num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .wp-input { flex: 1; border: none; background: transparent; font-size: 14px; font-family: inherit; outline: none; color: var(--text); }
    .wp-input::placeholder { color: var(--text3); }
  </style>
</head>
<body>
<div class="app" id="app">
  <header class="header" id="headerBar"></header>
  <main class="page-body" id="pageBody"></main>
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="0"><span class="nav-icon">🏠</span><span>首页</span></button>
    <button class="nav-item" data-tab="1"><span class="nav-icon">📝</span><span>记录</span></button>
    <button class="nav-item" data-tab="2"><span class="nav-icon">👤</span><span>我的</span></button>
  </nav>
</div>

<div class="overlay" id="departOverlay"><div class="overlay-mask" onclick="closeDepart()"></div><div class="overlay-panel" id="departPanel"></div></div>
<div class="overlay" id="createRouteOverlay"><div class="overlay-mask" onclick="closeCreateRoute()"></div><div class="overlay-panel" id="createRoutePanel"></div></div>
<div class="overlay" id="addEquipOverlay"><div class="overlay-mask" onclick="closeAddEquip()"></div><div class="overlay-panel" id="addEquipPanel"></div></div>
<div class="overlay" id="rideSummaryOverlay"><div class="overlay-mask"></div><div class="overlay-panel" id="rideSummaryPanel"></div></div>
<div class="ride-full" id="rideFull">
  <div class="ride-top"><span id="rideTitle">骑行中</span><button class="ride-ctrl-btn" style="width:40px;height:40px;font-size:16px" onclick="endRide()">✕</button></div>
  <div style="flex:1;background:#121212;display:flex;align-items:center;justify-content:center;font-size:64px;opacity:.08;">🗺️</div>
  <div class="ride-data"><div><span class="ride-value" id="rideSpeed">0.0</span><span class="ride-label">km/h</span></div><div><span class="ride-value" id="rideDist">0.0</span><span class="ride-label">km</span></div><div><span class="ride-value" id="rideTime">00:00</span><span class="ride-label">时间</span></div><div><span class="ride-value" id="rideElev">0</span><span class="ride-label">爬升m</span></div></div>
  <div class="ride-ctrl"><button class="ride-ctrl-btn ride-ctrl-sos" onclick="toast('🚨 求救信号已发送')">🆘</button><button class="ride-ctrl-btn" id="ridePauseBtn" onclick="togglePause()">⏸</button><button class="ride-ctrl-btn" onclick="toast('📸 标记已保存')">📸</button></div>
</div>

<script>
  const STORAGE_KEY = 'gowild_rc1';

  function loadState() { try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {} return getDefaultState(); }
  function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
  function getDefaultState() {
    return {
      activeTab: 0, subPage: null, selectedRoute: null, rideEnding: false,
      rideActive: false, ridePaused: false, rideTimer: null,
      rideData: { speed: 25.3, dist: 0, time: 0, elev: 412 },
      equipment: [],
      routes: [
        { n: '成都→都江堰', d: '68km', t: '3.5h', e: '412m', diff: '中级', waypoints: [{name:'成都'},{name:'郫都'},{name:'安德'},{name:'都江堰'}] },
        { n: '蒲虹路爬坡', d: '26km', t: '2h', e: '800m', diff: '挑战', waypoints: [{name:'山脚'},{name:'发夹弯'},{name:'山顶'}] },
        { n: '锦城绿道', d: '42km', t: '2h', e: '120m', diff: '休闲', waypoints: [{name:'起点'},{name:'彩虹桥'},{name:'终点'}] }
      ],
      records: [
        { n: '成都→都江堰', d: '5/28', s: '68km', t: '3h24m', c: '412m', v: '20.0' },
        { n: '蒲虹路爬坡', d: '5/25', s: '26km', t: '1h52m', c: '800m', v: '13.9' },
        { n: '锦城绿道', d: '5/22', s: '42km', t: '2h08m', c: '120m', v: '19.7' }
      ],
      totalKm: 1240, totalRides: 48,
      homeEditMode: false, homeHiddenModules: {}
    };
  }
  const state = loadState();
  if (!localStorage.getItem(STORAGE_KEY)) saveState();

  function switchTab(t) { state.activeTab = t; state.subPage = null; document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === t)); updateHeader(); render(); }
  function updateHeader() {
    const h = document.getElementById('headerBar');
    if (state.subPage) h.innerHTML = `<button style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--accent)" onclick="goBack()">‹</button><span style="font-weight:600;font-size:16px">${state.subPage.title}</span><div></div>`;
    else h.innerHTML = `<div class="brand">去野</div><div class="weather-pill" onclick="openSub('天气详情','weather')">☀️ 24°</div>`;
  }
  function goBack() { state.subPage = null; updateHeader(); render(); }
  function openSub(t, k) { state.subPage = { title: t, key: k }; updateHeader(); render(); }
  function render() {
    const b = document.getElementById('pageBody');
    if (state.subPage) { b.innerHTML = renderSub(); return; }
    if (state.activeTab === 0) b.innerHTML = renderHome();
    else if (state.activeTab === 1) b.innerHTML = renderRecord();
    else b.innerHTML = renderProfile();
  }

  function renderHome() {
    const issues = state.equipment.filter(e => e.s !== 'ok').length;
    const hidden = state.homeHiddenModules || {};
    const edit = state.homeEditMode;
    const editBtn = `<button class="home-edit-btn" onclick="toggleHomeEdit()">${edit ? '完成' : '编辑首页'}</button>`;
    let html = `<div style="margin-top:6px">`;
    if (!hidden.weather) {
      html += `<div class="card ${edit ? 'editing' : ''}" style="background:linear-gradient(135deg,#F9F7F2,#F4EFE6);padding:22px 20px;position:relative">${edit ? '<span class="module-hide" onclick="hideModule(\'weather\')">✕</span>' : ''}<div class="row"><span style="font-size:38px;font-weight:700">24°</span><span style="font-size:14px;color:var(--accent);font-weight:600">适合骑行</span></div><div style="font-size:13px;color:var(--text2);margin-top:4px">晴 · 东南风2级 · 未来3h无雨</div><div style="display:flex;gap:22px;margin-top:16px"><div><span style="font-size:11px;color:var(--text3)">湿度</span><br><span style="font-weight:600">58%</span></div><div><span style="font-size:11px;color:var(--text3)">UV指数</span><br><span style="font-weight:600">中等</span></div><div><span style="font-size:11px;color:var(--text3)">日落</span><br><span style="font-weight:600">19:24</span></div></div></div>`;
    } else if (edit) html += `<div class="ghost-module" onclick="restoreModule('weather')">🌤️ 天气卡片（点击恢复）</div>`;
    html += `<div class="personal-stats">你今年已骑行 ${state.totalKm}km · ${state.totalRides}次 · 爬升 12,400m</div>`;
    html += `<div class="hero-card" onclick="startDepartFlow()"><div style="font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.5px;text-transform:uppercase">开始骑行</div><div style="font-size:28px;font-weight:700;margin-top:4px">准备好出发了吗？</div><div style="font-size:14px;color:var(--text2);margin-top:4px">选择路线或自由记录，即刻开始</div><button class="hero-btn">＋ 出发</button></div>`;
    if (!hidden.routes) {
      html += `<div class="section-title">${editBtn} 我的路线</div><div class="card ${edit ? 'editing' : ''}" style="position:relative">${edit ? '<span class="module-hide" onclick="hideModule(\'routes\')">✕</span>' : ''}`;
      if (state.routes.length === 0) {
        html += `<div style="text-align:center;padding:20px;color:var(--text3)">还没有路线，点击下方新建</div>`;
      } else {
        state.routes.forEach(r => {
          html += `<div class="record-item" style="position:relative"><div class="record-icon" onclick="openSub('${r.n}','route-detail')">🗺️</div><div class="record-info" onclick="openSub('${r.n}','route-detail')"><div class="record-name">${r.n}</div><div class="record-meta">${r.d} · ${r.t} · ${r.e} · ${r.waypoints?r.waypoints.length+'个途经点':''}</div></div><span class="quick-depart-btn" onclick="event.stopPropagation(); quickDepart('${r.n}')">→</span></div>`;
        });
      }
      html += `<button class="btn btn-secondary" style="margin-top:8px" onclick="openCreateRoute()">＋ 新建路线</button></div>`;
    } else if (edit) html += `<div class="ghost-module" onclick="restoreModule('routes')">🗺️ 路线模块（点击恢复）</div>`;
    if (!hidden.equip) {
      const eqCardStyle = state.equipment.length === 0 ? 'border: 2px solid var(--danger);' : (issues > 0 ? 'border: 2px solid var(--danger);' : '');
      html += `<div class="section-title">出发准备</div><div class="card ${edit ? 'editing' : ''}" style="position:relative;cursor:pointer;${eqCardStyle}" onclick="openSub('装备清单','equip')">${edit ? '<span class="module-hide" onclick="hideModule(\'equip\')">✕</span>' : ''}<div class="row"><span style="font-weight:600;font-size:16px">🛠️ 装备清单</span>${state.equipment.length===0?'<span style="font-size:12px;color:var(--danger);font-weight:600">未添加装备</span>':(issues>0?`<span style="font-size:12px;color:var(--danger);font-weight:600">${issues}项待处理</span>`:'<span style="font-size:12px;color:var(--success);font-weight:600">就绪</span>')}</div><div class="equip-grid" style="margin-top:12px">${state.equipment.length===0?'<span style="font-size:13px;color:var(--text3)">点击添加你的装备</span>':state.equipment.map(e=>`<div class="equip-chip ${e.s==='ok'?'ok':e.s==='attention'?'warn':'miss'}">${e.i} ${e.n}</div>`).join('')}</div></div>`;
    } else if (edit) html += `<div class="ghost-module" onclick="restoreModule('equip')">🛠️ 装备清单（点击恢复）</div>`;
    if (!hidden.repair) {
      html += `<div class="card ${edit ? 'editing' : ''}" style="position:relative;cursor:pointer" onclick="openSub('维修手册','repair')">${edit ? '<span class="module-hide" onclick="hideModule(\'repair\')">✕</span>' : ''}<div class="row"><span style="font-weight:600;font-size:16px">🔧 维修手册</span><span style="color:var(--text3)">›</span></div><div style="font-size:13px;color:var(--text2);margin-top:4px">补胎·换胎·链条·刹车·安全应急 · 离线可用</div></div>`;
    } else if (edit) html += `<div class="ghost-module" onclick="restoreModule('repair')">🔧 维修手册（点击恢复）</div>`;
    if (edit) html += `<button class="btn btn-secondary" style="margin-top:8px" onclick="resetHomeLayout()">恢复默认布局</button>`;
    html += `</div>`;
    return html;
  }

  function startDepartFlow() {
    if (state.routes.length === 0) { toast('请先新建一条路线'); openCreateRoute(); return; }
    document.getElementById('departPanel').innerHTML = `
      <div style="width:36px;height:4px;background:rgba(0,0,0,.1);border-radius:4px;margin:0 auto 18px"></div>
      <div style="text-align:center;margin-bottom:16px"><div style="font-size:18px;font-weight:700">选择出发方式</div></div>
      <div class="card" style="cursor:pointer;margin-bottom:10px" onclick="showDepartConfirm()">🗺️ 选择已有路线出发</div>
      <div class="card" style="cursor:pointer;margin-bottom:10px" onclick="closeDepart(); openCreateRoute()">➕ 新建路线并出发</div>
      <div class="card" style="cursor:pointer;margin-bottom:10px" onclick="state.selectedRoute=null; closeDepart(); showDepartConfirm()">🎯 自由记录开始</div>
      <button class="btn btn-secondary" style="margin-top:16px" onclick="closeDepart()">取消</button>
    `;
    document.getElementById('departOverlay').classList.add('show');
  }

  function quickDepart(routeName) { state.selectedRoute = routeName; saveState(); showDepartConfirm(); }
  function showDepartConfirm() {
    const issues = state.equipment.filter(e => e.s !== 'ok');
    const isEmpty = state.equipment.length === 0;
    const sel = state.selectedRoute ? `已选: ${state.selectedRoute}` : '自由骑行';
    let equipHTML = isEmpty ? `<span style="color:var(--danger);cursor:pointer" onclick="closeDepart();openSub('装备清单','equip')">尚未添加装备，请点击添加</span>` : (issues.length > 0 ? `<span style="color:var(--danger);cursor:pointer" onclick="closeDepart();openSub('装备清单','equip')">${issues.length}项待处理：${issues.map(e=>e.n).join('、')}</span>` : `<span style="color:var(--success)">全部就绪 ✅</span>`);
    document.getElementById('departPanel').innerHTML = `
      <div style="width:36px;height:4px;background:rgba(0,0,0,.1);border-radius:4px;margin:0 auto 18px"></div>
      <div style="text-align:center;margin-bottom:16px"><div style="font-size:18px;font-weight:700">出发确认</div></div>
      <div style="margin-bottom:12px"><strong>路线：</strong>${sel}</div>
      <div style="margin-bottom:12px"><strong>天气：</strong>晴 24° 东南风2级</div>
      <div style="margin-bottom:16px"><strong>装备：</strong>${equipHTML}</div>
      <button class="btn btn-primary" id="confirmStartBtn" ${isEmpty?'disabled':''} onclick="startRide()">▶️ 开始骑行</button>
      <button class="btn btn-secondary" style="margin-top:8px" onclick="closeDepart()">取消</button>
    `;
    document.getElementById('departOverlay').classList.add('show');
  }
  function closeDepart() { document.getElementById('departOverlay').classList.remove('show'); }

  // 新建路线（带模拟规划流程）
  function openCreateRoute() {
    document.getElementById('createRoutePanel').innerHTML = `
      <div style="width:36px;height:4px;background:rgba(0,0,0,.1);border-radius:4px;margin:0 auto 18px"></div>
      <div style="text-align:center;margin-bottom:16px"><div style="font-size:18px;font-weight:700">新建路线</div></div>
      <div class="card" style="cursor:pointer;margin-bottom:10px" onclick="startMapPlanning()">🗺️ 地图打点规划</div>
      <div class="card" style="cursor:pointer;margin-bottom:10px" onclick="simulateImportGPX()">📁 导入GPX轨迹</div>
      <div class="card" style="cursor:pointer;margin-bottom:10px" onclick="simulateFromHistory()">📝 从历史记录创建</div>
      <button class="btn btn-secondary" style="margin-top:16px" onclick="closeCreateRoute()">取消</button>
    `;
    document.getElementById('createRouteOverlay').classList.add('show');
  }
  function closeCreateRoute() { document.getElementById('createRouteOverlay').classList.remove('show'); }

  // 模拟地图打点流程
  function startMapPlanning() {
    let waypoints = [{name:'起点'}];
    let step = 0;
    function renderPlanning() {
      const totalDist = (waypoints.length * 12 + Math.floor(Math.random()*20)) + 'km';
      const totalElev = (waypoints.length * 150 + Math.floor(Math.random()*300)) + 'm';
      const totalTime = Math.floor(waypoints.length * 0.8) + 'h';
      document.getElementById('createRoutePanel').innerHTML = `
        <div style="width:36px;height:4px;background:rgba(0,0,0,.1);border-radius:4px;margin:0 auto 18px"></div>
        <div style="text-align:center;margin-bottom:12px"><div style="font-size:18px;font-weight:700">地图打点规划</div><div style="font-size:12px;color:var(--text3)">点击地图添加途经点（模拟）</div></div>
        <div style="background:var(--bg);border-radius:var(--radius);height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:48px;cursor:pointer" onclick="addWaypoint()">🗺️<span style="font-size:12px;color:var(--text3);margin-left:8px">点击模拟添加途经点</span></div>
        <div style="margin-bottom:8px;font-weight:600">途经点 (${waypoints.length}个)</div>
        ${waypoints.map((wp,i)=>`<div class="wp-item"><div class="wp-num">${i+1}</div><input class="wp-input" value="${wp.name}" onchange="updateWPName(${i},this.value)" placeholder="途经点名称"></div>`).join('')}
        <div style="display:flex;gap:8px;margin-top:8px;font-size:12px;color:var(--text2)"><span>总距离: ${totalDist}</span><span>爬升: ${totalElev}</span><span>预估: ${totalTime}</span></div>
        <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-secondary" style="flex:1" onclick="addWaypoint()">＋ 添加途经点</button><button class="btn btn-primary" style="flex:1" onclick="savePlannedRoute()">保存路线</button></div>
        <button class="btn btn-secondary" style="margin-top:8px" onclick="closeCreateRoute()">取消</button>
      `;
    }
    window.addWaypoint = function() {
      waypoints.push({name:'途经点'+(waypoints.length)});
      renderPlanning();
    };
    window.updateWPName = function(i, val) { waypoints[i].name = val; };
    window.savePlannedRoute = function() {
      const name = waypoints[0].name === '起点' ? '新路线' : waypoints[0].name;
      const dist = (waypoints.length * 12 + Math.floor(Math.random()*20)) + 'km';
      const elev = (waypoints.length * 150 + Math.floor(Math.random()*300)) + 'm';
      const time = Math.floor(waypoints.length * 0.8) + 'h';
      state.routes.push({ n: name, d: dist, t: time, e: elev, diff: '休闲', waypoints });
      state.selectedRoute = name;
      saveState();
      closeCreateRoute();
      toast('路线已保存');
      setTimeout(() => { showDepartConfirm(); }, 300);
    };
    renderPlanning();
  }

  function simulateImportGPX() {
    const name = prompt('路线名称：', '导入的路线');
    if (!name) return;
    const waypoints = [{name:'起点'},{name:'途经点1'},{name:'终点'}];
    state.routes.push({ n: name, d: '45km', t: '2.5h', e: '600m', diff: '中级', waypoints });
    state.selectedRoute = name;
    saveState();
    closeCreateRoute();
    toast('路线已导入');
    setTimeout(() => { showDepartConfirm(); }, 300);
  }

  function simulateFromHistory() {
    if (state.records.length === 0) { toast('暂无历史记录'); return; }
    const rec = state.records[0];
    const waypoints = [{name:'起点'},{name:'途经点1'},{name:'终点'}];
    state.routes.push({ n: rec.n + '(副本)', d: rec.s, t: rec.t, e: rec.c, diff: '休闲', waypoints });
    state.selectedRoute = rec.n + '(副本)';
    saveState();
    closeCreateRoute();
    toast('已从历史记录创建路线');
    setTimeout(() => { showDepartConfirm(); }, 300);
  }

  function toggleHomeEdit() { state.homeEditMode = !state.homeEditMode; render(); }
  function hideModule(key) { if (!state.homeHiddenModules) state.homeHiddenModules = {}; state.homeHiddenModules[key] = true; saveState(); render(); }
  function restoreModule(key) { if (!state.homeHiddenModules) state.homeHiddenModules = {}; delete state.homeHiddenModules[key]; saveState(); render(); }
  function resetHomeLayout() { state.homeHiddenModules = {}; saveState(); render(); }

  function renderRecord() {
    const records = state.records;
    const now = new Date(); const thisMonth = now.getMonth();
    const monthRecords = records.filter(r => { if (r.d === '今天' || r.d === '刚刚') return true; const parts = r.d.split('/'); if (parts.length === 2) { return parseInt(parts[0]) - 1 === thisMonth; } return false; });
    const totalDist = monthRecords.reduce((sum, r) => sum + parseFloat(r.s), 0);
    const totalClimb = monthRecords.reduce((sum, r) => sum + parseInt(r.c), 0);
    const totalCount = monthRecords.length;
    return `<div style="margin-top:6px"><div class="section-title">本月统计</div><div class="row card" style="padding:22px"><div style="text-align:center;flex:1"><div style="font-size:32px;font-weight:700">${totalDist.toFixed(0)}</div><div style="font-size:11px;color:var(--text3)">公里</div></div><div style="text-align:center;flex:1"><div style="font-size:32px;font-weight:700">${totalCount}</div><div style="font-size:11px;color:var(--text3)">次骑行</div></div><div style="text-align:center;flex:1"><div style="font-size:32px;font-weight:700">${(totalClimb/1000).toFixed(1)}k</div><div style="font-size:11px;color:var(--text3)">爬升m</div></div></div><div class="section-title">最近记录</div><div class="card">${records.map(r=>`<div class="record-item" onclick="openSub('${r.n}','rec-detail')"><div class="record-icon">🗺️</div><div class="record-info"><div class="record-name">${r.n}</div><div class="record-meta">${r.d} · ${r.s} · ${r.t} · ${r.c}</div></div><div class="record-stat">${r.v} km/h</div></div>`).join('')}</div><button class="btn btn-primary" style="margin-top:8px" onclick="toast('正在生成3D路书...')">🎬 查看3D路书回放</button></div>`;
  }

  function renderProfile() {
    return `<div style="text-align:center;padding:32px 0 20px"><div style="width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#F9F7F2,#F4EFE6);display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 14px">🚴</div><div style="font-weight:700;font-size:20px">骑行达人</div><div class="row" style="justify-content:center;gap:36px;margin-top:14px"><div style="text-align:center"><div style="font-weight:700;font-size:20px">${state.totalKm}</div><div style="font-size:11px;color:var(--text3)">总公里</div></div><div style="text-align:center"><div style="font-weight:700;font-size:20px">${state.totalRides}</div><div style="font-size:11px;color:var(--text3)">总骑行</div></div></div></div><div class="section-title">成就勋章</div><div class="card"><div class="badge-grid">${[{i:'🚀',n:'破百'},{i:'⛰️',n:'爬升王'},{i:'🌙',n:'夜骑侠'},{i:'🔥',n:'连续7天'},{i:'💯',n:'百公里'}].map(b=>`<div class="badge-item" onclick="toast('${b.n}')"><div class="badge-icon">${b.i}</div><div class="badge-label">${b.n}</div></div>`).join('')}</div></div><div class="section-title">设置</div><div class="card">${['账号安全','离线地图','通知提醒','隐私设置','关于去野'].map(s=>`<div class="record-item" onclick="openSub('${s}','settings')"><span style="flex:1;font-size:15px">${s}</span><span style="color:var(--text3)">›</span></div>`).join('')}</div>`;
  }

  function renderSub() {
    const k = state.subPage.key;
    if (k === 'weather') return `<div style="margin-top:6px"><div class="card" style="background:linear-gradient(135deg,#F9F7F2,#F4EFE6);padding:22px 20px"><div style="font-size:14px;color:var(--accent);font-weight:600">成都 · 当前天气</div><div style="font-size:48px;font-weight:700;margin-top:8px">24°</div><div style="font-size:15px;color:var(--text2);margin-top:4px">晴 · 东南风2级</div><div style="display:flex;gap:22px;margin-top:20px"><div><span style="font-size:11px;color:var(--text3)">湿度</span><br><span style="font-weight:600">58%</span></div><div><span style="font-size:11px;color:var(--text3)">UV指数</span><br><span style="font-weight:600">中等</span></div><div><span style="font-size:11px;color:var(--text3)">气压</span><br><span style="font-weight:600">1012hPa</span></div><div><span style="font-size:11px;color:var(--text3)">日落</span><br><span style="font-weight:600">19:24</span></div></div></div><div class="card"><div class="section-title">未来3小时</div><div class="row">${[{t:'现在',i:'☀️',v:'24°'},{t:'1h后',i:'☀️',v:'25°'},{t:'2h后',i:'⛅',v:'23°'},{t:'3h后',i:'⛅',v:'22°'}].map(h=>`<div style="text-align:center"><div style="font-size:11px;color:var(--text3)">${h.t}</div><div style="font-size:28px;margin:4px 0">${h.i}</div><div style="font-size:14px;font-weight:600">${h.v}</div></div>`).join('')}</div></div></div>`;
    if (k === 'route-detail') {
      const r = state.routes.find(r => r.n === state.subPage.title) || state.routes[0];
      const segments = r.waypoints ? r.waypoints.map((wp, i, arr) => {
        if (i === 0) return { c: 'var(--success)', n: wp.name, m: '起点 · 出发' };
        if (i === arr.length - 1) return { c: 'var(--info)', n: wp.name, m: '终点 · 到达' };
        return { c: 'var(--accent)', n: wp.name, m: '途经点 · 经过' };
      }) : [{ c: 'var(--success)', n: '起点', m: '出发' }, { c: 'var(--info)', n: '终点', m: '到达' }];
      return `<div style="margin-top:6px"><div class="card"><div class="section-title">${r.n}</div><div style="font-size:14px;color:var(--text2)">${r.d} · ${r.t} · ${r.e} · ${r.waypoints?r.waypoints.length+'个途经点':''}</div></div><div class="card"><div class="section-title">📍 分段详情</div>${segments.map(s=>`<div class="record-item"><div style="width:10px;height:10px;border-radius:50%;background:${s.c};margin-right:10px"></div><div><strong>${s.n}</strong><br><span style="font-size:12px;color:var(--text2)">${s.m}</span></div></div>`).join('')}</div><button class="btn btn-primary" onclick="quickDepart('${r.n}')">🚴 用此路线出发</button></div>`;
    }
    if (k === 'equip') return `<div style="margin-top:6px"><div class="section-title">装备清单</div><div class="card"><div class="equip-grid">${state.equipment.length===0?'<span style="font-size:13px;color:var(--text3)">还没有装备，点击下方添加</span>':state.equipment.map((e,i)=>`<div class="equip-chip ${e.s==='ok'?'ok':e.s==='attention'?'warn':'miss'}" onclick="cycleEquip(${i})">${e.i} ${e.n}</div>`).join('')}</div></div><button class="btn btn-secondary" style="margin-top:8px" onclick="openAddEquip()">＋ 添加装备</button>`;
    if (k === 'repair') return `<div style="margin-top:6px"><div class="section-title">维修手册</div><div class="card">${[{t:'补胎教程',d:'1.找到漏气点 2.打磨内胎 3.涂胶水 4.贴补片 5.按压3分钟'},{t:'换内胎',d:'1.拆卸车轮 2.取出破损内胎 3.检查外胎内侧 4.装入新内胎 5.充气'},{t:'链条上油',d:'1.清洁链条 2.逐节滴润滑油 3.转动曲柄 4.擦去多余油'},{t:'刹车调整',d:'1.检查来令片磨损 2.调节刹车线松紧 3.测试刹车力度'}].map(t=>`<div class="record-item" onclick="toggleRepair(this)"><div class="record-icon">🛞</div><div class="record-info"><div class="record-name">${t.t}</div><div class="repair-detail" style="display:none;font-size:13px;color:var(--text2);margin-top:4px;line-height:1.6">${t.d}</div></div><span class="repair-arrow" style="color:var(--text3)">▼</span></div>`).join('')}</div>`;
    return `<div style="text-align:center;padding:40px;color:var(--text3)">功能开发中</div>`;
  }
  function toggleRepair(el) { const d=el.querySelector('.repair-detail'); const a=el.querySelector('.repair-arrow'); if(d.style.display==='none'||!d.style.display){d.style.display='block';a.textContent='▲';}else{d.style.display='none';a.textContent='▼';} }
  function cycleEquip(i) { const st=['ok','attention','missing']; const idx=st.indexOf(state.equipment[i].s); state.equipment[i].s=st[(idx+1)%3]; saveState(); render(); }

  function openAddEquip() {
    document.getElementById('addEquipPanel').innerHTML=`<div style="width:36px;height:4px;background:rgba(0,0,0,.1);border-radius:4px;margin:0 auto 18px"></div><div style="text-align:center;margin-bottom:16px"><div style="font-size:18px;font-weight:700">添加装备</div></div><input id="equipName" placeholder="装备名称" style="width:100%;padding:14px;border-radius:12px;border:1px solid rgba(0,0,0,.1);font-size:15px;font-family:inherit;outline:none;margin-bottom:12px"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${['⛑️','🧤','🫗','🛞','🔧','🍬','🧥','🩹','🔋','🕶️'].map(i=>`<span style="font-size:24px;cursor:pointer;padding:8px;border-radius:8px;background:var(--surface)" onclick="document.getElementById('equipName').value+='${i}'">${i}</span>`).join('')}</div><button class="btn btn-primary" onclick="addEquip()">添加</button><button class="btn btn-secondary" style="margin-top:8px" onclick="closeAddEquip()">取消</button>`;
    document.getElementById('addEquipOverlay').classList.add('show');
  }
  function closeAddEquip() { document.getElementById('addEquipOverlay').classList.remove('show'); }
  function addEquip() { const name=document.getElementById('equipName').value.trim(); if(!name)return; const icon=[...name].find(c=>c.match(/\p{Emoji}/u))||'🔧'; state.equipment.push({n:name,i:icon,s:'ok'}); saveState(); closeAddEquip(); render(); toast('已添加: '+name); }

  function startRide() {
    closeDepart(); state.rideActive=true; state.ridePaused=false; state.rideEnding=false;
    state.rideData={speed:25.3,dist:0,time:0,elev:412};
    document.getElementById('rideFull').classList.add('active');
    document.getElementById('rideTitle').textContent=state.selectedRoute?`骑行中 · ${state.selectedRoute}`:'骑行中 · 自由骑行';
    document.getElementById('ridePauseBtn').textContent='⏸'; updateRideUI();
    if(state.rideTimer)clearInterval(state.rideTimer);
    state.rideTimer=setInterval(()=>{if(!state.ridePaused){state.rideData.time+=1;state.rideData.dist+=.007;state.rideData.speed=25+Math.sin(state.rideData.time/60)*3+(Math.random()-.5)*2;updateRideUI();}},1000);
  }
  function endRide() { if(state.rideEnding)return; state.rideEnding=true; state.rideActive=false; clearInterval(state.rideTimer); document.getElementById('rideFull').classList.remove('active'); const d=state.rideData; const m=Math.floor(d.time/60),s=d.time%60; const record={n:state.selectedRoute||'自由骑行',d:'今天',s:d.dist.toFixed(1)+'km',t:m+'分'+s+'秒',c:d.elev+'m',v:d.speed.toFixed(1)}; state.records.unshift(record); state.totalKm+=Math.round(d.dist); state.totalRides+=1; state.selectedRoute=null; saveState(); document.getElementById('rideSummaryPanel').innerHTML=`<div style="text-align:center;padding:16px 0"><div style="font-size:48px;margin-bottom:12px">🚴</div><div style="font-size:22px;font-weight:700;margin-bottom:16px">骑行结束</div><div style="display:flex;justify-content:space-around;margin-bottom:20px"><div><div style="font-size:28px;font-weight:700;color:var(--accent)">${record.s}</div><div style="font-size:11px;color:var(--text3)">距离</div></div><div><div style="font-size:28px;font-weight:700;color:var(--accent)">${record.t}</div><div style="font-size:11px;color:var(--text3)">用时</div></div><div><div style="font-size:28px;font-weight:700;color:var(--accent)">${record.v}</div><div style="font-size:11px;color:var(--text3)">均速km/h</div></div></div><button class="btn btn-primary" onclick="closeRideSummary()">完成</button></div>`; document.getElementById('rideSummaryOverlay').classList.add('show'); }
  function closeRideSummary() { document.getElementById('rideSummaryOverlay').classList.remove('show'); switchTab(1); }
  function togglePause() { state.ridePaused=!state.ridePaused; document.getElementById('ridePauseBtn').textContent=state.ridePaused?'▶':'⏸'; }
  function updateRideUI() { document.getElementById('rideSpeed').textContent=state.rideData.speed.toFixed(1); document.getElementById('rideDist').textContent=state.rideData.dist.toFixed(1); const m=Math.floor(state.rideData.time/60),s=state.rideData.time%60; document.getElementById('rideTime').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); document.getElementById('rideElev').textContent=state.rideData.elev; }
  function toast(msg) { const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }

  document.querySelectorAll('.nav-item').forEach(el=>el.addEventListener('click',function(){switchTab(parseInt(this.dataset.tab));}));
  updateHeader(); render();
</script>
</body>
</html>
