name: gowild_app
description: 去野 - 骑行决策与记录工具

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  provider: ^6.1.1
  intl: ^0.18.1
  flutter_animate: ^4.3.0
  liquid_pull_to_refresh: ^3.0.1
  permission_handler: ^11.1.0
  sensors_plus: ^4.0.2
  vibration: ^1.8.4
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
